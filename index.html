<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>oi...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            overflow: hidden;
        }
        .container {
            padding: 20px;
        }
        h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin: 0;
            animation: fadeIn 1s ease-in-out;
        }
        span {
            color: #0095f6; /* Instagram Blue accent */
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="greeting">oi <span id="username">there</span></h1>
    </div>

    <script>
        // Check if a username was passed in the URL hash (e.g., yoursite.com/#yourname)
        let hash = window.location.hash.substring(1);
        
        if (hash) {
            document.getElementById('username').innerText = decodeURIComponent(hash);
        } else {
            // Optional: Fallback prompt if someone opens the link directly without a handle
            const user = prompt("What's your Instagram username?");
            if (user) {
                document.getElementById('username').innerText = user.trim();
            }
        }
    </script>

</body>
</html>
